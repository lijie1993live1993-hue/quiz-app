name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip Source Code
      run: unzip OfflineSearchQuiz_Final.zip -d .
      
    - name: Patch Gradle Files for Kotlin 2.0
      run: |
        sed -i '/id("com.google.devtools.ksp")/a \    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false' build.gradle.kts
        sed -i '/id("com.google.devtools.ksp")/a \    id("org.jetbrains.kotlin.plugin.compose")' app/build.gradle.kts
        sed -i '/composeOptions/d' app/build.gradle.kts

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.9
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.9
        
    - name: Build with Gradle
      run: gradle assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
